<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer Login</title>
</head>
<body>
    <main>
        <section class="campos-login">
            <h1>Bem vindo ao meu site</h1>
            <p>Faça login abaixo</p>
            <form id="form-login">
                <input type="text" placeholder="Usuario" id="captura-user" required>
                <input type="email" placeholder="Senha" id="captura-email" required>
                <input type="password" placeholder="Senha" id="captura-senha" required>
                <input type="submit" value="FAZER LOGIN">
            </form>
            <a href=cadastro.html><button>FAZER CADASTRO</button></a>
        </section>
        <section class="usuarios-cadastrados">
            <ul id="lista-usuarios">

            </ul>
        </section>
    </main>
    <script src="index.js"></script>
</body>
</html>
